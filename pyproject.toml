[project]
name = "toobit-bot-v2-ws-gpt"
version = "0.1.0"
description = "Multi-symbol Toobit breakout trading bot"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32,<3",
  "websocket-client>=1.8,<2",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["logs*", "tests*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
